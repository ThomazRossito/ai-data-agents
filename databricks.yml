# ═══════════════════════════════════════════════════════════════════
# Declarative Automation Bundles — AI Data Agents
# (renomeado de "Databricks Asset Bundles" em 16/mar/2026; a mudança é
#  NÃO-BREAKING: o comando `databricks bundle` e a config seguem iguais)
# Multi-environment: dev, staging, production
# ═══════════════════════════════════════════════════════════════════
#
# ── Pendências conhecidas (auditoria 2026-09-13) ────────────────────
#
# 1. MOTOR DE DEPLOY. O "direct deployment engine" ficou GA em 10/jun/2026
#    (CLI 1.3.0) e passou a ser o default para bundles NOVOS. Este bundle é
#    anterior, então provavelmente ainda usa o motor Terraform. Existe o
#    comando `databricks bundle migrate` para converter.
#    ⚠️ Há relato de que o motor Terraform será desabilitado em releases novas
#    da CLI a partir de set/2026 — NÃO confirmei isso nas release notes oficiais
#    de bundles; verificar em "What's coming?" antes de planejar o prazo.
#
# 2. `/Shared` + `permissions`. Os targets staging/production usam
#    `root_path: /Shared/...` (acessível a todos) junto com `permissions`
#    restritivas. A CLI emite warning nessa combinação desde a 0.231.0 —
#    ou afrouxe as permissions, ou mova o root_path para fora de /Shared.
#
# 3. RECURSOS NOVOS que este bundle ainda não usa e que casam com os agentes
#    deste projeto: `genie_space` (Genie Agents), `vector_search_endpoint` /
#    `vector_search_index`, `postgres_project`/`branch`/`endpoint` (Lakebase),
#    `alert` (SQL alerts), `schema` (Unity Catalog), `app`, `dashboard`.
#
# Release notes: https://docs.databricks.com/aws/en/release-notes/dev-tools/bundles

bundle:
  name: data_agents

# NOTA (auditoria 2026-09-13): o `include: resources/*.yml` foi removido —
# o diretório `resources/` nunca existiu neste repo, então o include apontava
# para o vazio. Se voltar a existir, reative esta chave.

variables:
  catalog:
    default: "dev_vendas"
  schema:
    default: "vendas"

# NOTA (auditoria 2026-09-13): o bloco `workspace: host: ${workspace.host}` foi
# removido por ser AUTO-REFERENTE — definia workspace.host como ele mesmo.
# A CLI não conseguia resolver, repassava a string literal e falhava com
#   parse "https://${workspace.host}": invalid character "{" in host name
# Isso derrubava QUALQUER comando `databricks` executado na raiz do repo
# (incluindo `databricks aitools`, `current-user me` e `bundle deploy`),
# porque a CLI entra em modo bundle ao encontrar este arquivo.
#
# O host agora vem da cadeia padrão de auth da Databricks, nesta ordem:
#   1. flag --profile / DATABRICKS_CONFIG_PROFILE  (~/.databrickscfg)
#   2. variável de ambiente DATABRICKS_HOST        (já presente no .env)
# Para fixar o host por ambiente, declare-o dentro do `targets:` abaixo.

# ─── Shared Resources ────────────────────────────────────────────

resources:
  jobs:
    health_check_job:
      name: "[${bundle.target}] Databricks Agents Health Check"
      tasks:
        - task_key: run_health_check
          new_cluster:
            # DBR 17.3 LTS (suporte até out/2028). Era 14.3.x — ~3 gerações
            # atrás, atualizado na auditoria 2026-09-13.
            spark_version: "17.3.x-scala2.12"
            # TODO: `Standard_DS3_v2` é série de VM legada. A troca mexe em
            # custo, então ficou como decisão pendente do dono do projeto.
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
          spark_python_task:
            python_file: ./tools/databricks_health_check.py

# ─── Sync Configuration ──────────────────────────────────────────

sync:
  include:
    - "skills/**"
    - "agents/**"
    - "config/**"
    - "hooks/**"
    - "commands/**"
    - "mcp_servers/**"
    - "main.py"
    - "pyproject.toml"
  exclude:
    - "tests/**"
    - ".github/**"
    - "**/*.pyc"
    - "**/__pycache__"

# ─── Targets (Environments) ──────────────────────────────────────

targets:
  # ─── Development ──────────────────────────────────────────────
  dev:
    mode: development
    default: true

  # ─── Staging ──────────────────────────────────────────────────
  staging:
    workspace:
      root_path: /Shared/data-agents-staging
    permissions:
      - level: CAN_VIEW
        group_name: data-agents-viewers
      - level: CAN_MANAGE
        group_name: data-agents-admins

  # ─── Production ──────────────────────────────────────────────
  production:
    workspace:
      root_path: /Shared/data-agents-prod
    permissions:
      - level: CAN_VIEW
        group_name: data-agents-viewers
      - level: CAN_MANAGE
        group_name: data-agents-admins
    run_as:
      service_principal_name: data-agents-sp
