# ════════════════════════════════════════════════════════════════════════════
# Delegation Map — fonte única do roteamento "Situação → Agente"
# ════════════════════════════════════════════════════════════════════════════
# Regra: adicionar agente = editar este YAML; a tabela markdown em
# kb/task_routing.md §2 é regenerada a partir daqui (agents/delegation.py).
#
# Campos:
#   situation  — rótulo humano exibido na tabela markdown
#   agent      — slug do agente (tem que existir em agents/registry/<slug>.md)
#   tier       — T0/T1/T2/T3 (informativo; fonte de verdade é o frontmatter do registry)
#   keywords   — (opcional) palavras-chave para classificação programática futura
# ════════════════════════════════════════════════════════════════════════════

routes:
  # Migração
  - situation: "Migração SQL Server/PostgreSQL → Databricks/Fabric"
    agent: migration-expert
    tier: T1
    keywords: [migração, migration, "sql-server", "sql server", postgres, postgresql]
  - situation: "/migrate ou assessment de banco relacional"
    agent: migration-expert
    tier: T1
    keywords: [migrate, assessment, cutover]
  - situation: "DDL de origem extraído → propor Medallion"
    agent: migration-expert
    tier: T1
    keywords: [ddl, medallion, assessment]

  # Migração completa de banco SQL Server → Databricks (schema+dados+T-SQL+CDC+reconciliação+cutover)
  - situation: "Migrar banco/instância SQL Server inteiro (schema+dados+T-SQL+CDC+cutover) para Databricks"
    agent: sqlserver-to-databricks
    tier: T1
    keywords: ["sql server", "discovery", "dmv", "complexity scoring", "t-shirt sizing", "lakebridge", "lakehouse federation", cutover, freeze, rollback]
  - situation: "Discovery/assessment de SQL Server via DMVs / Complexity Scoring Matrix / waves"
    agent: sqlserver-to-databricks
    tier: T1
    keywords: ["dm_db_partition_stats", "sys.sql_modules", "complexity scoring", waves, "t-shirt sizing"]
  - situation: "CDC do SQL Server / reconciliação em 2 fases / runbook de cutover"
    agent: sqlserver-to-databricks
    tier: T1
    keywords: [cdc, "change data capture", "auto cdc", "lakeflow connect", reconciliação, "freeze window", "go/no-go"]

  # Migração SSIS (pacotes ETL .dtsx)
  - situation: "Migrar SSIS / pacotes .dtsx / Integration Services para Databricks"
    agent: ssis-to-databricks
    tier: T1
    keywords: [ssis, dtsx, "integration services", ssisdb, "control flow", "data flow", pacote, ".dtsx", ispac]
  - situation: "Converter Data Flow / Control Flow / SCD Wizard do SSIS para PySpark/DLT"
