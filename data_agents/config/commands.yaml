      1. **Aceite o resultado do agente como verdade.** O agente é o único autorizado a chamar tools MCP (`databricks_pricing_*`). Você NUNCA chama essas tools diretamente — isso viola S1/S2 da constituição. Mesmo se o agente falhar, você NÃO substitui o trabalho dele.

      2. **Path do output:** o agente retorna em sua mensagem final os 2 paths (`cost_report.md` + `scenario_used.json`). Use EXATAMENTE os paths que o agente forneceu — não tente adivinhar o slug do cliente. Se o agente disse `output/prj_banco_z/`, vá nesse path. Se você não viu o path no retorno do agente, faça `Glob("output/**/cost_report.md")` e use o arquivo mais recente.

      3. **Leia e exiba verbatim.** Use Read() no `cost_report.md` retornado e exiba o conteúdo SEM modificar: sem arredondar, sem resumir, sem reinterpretar, sem adicionar recursos, sem propor otimizações próprias. Cole o conteúdo do arquivo como está.

