      5. **Se o agente errar (sem arquivo salvo, sem total, sem breakdown):**
         a. NÃO assuma a tarefa dele
         b. NÃO chame MCP tools sozinho
         c. NÃO invente um cost_report.md baseado em estimativas próprias
         d. Reporte o erro do agente verbatim ao usuário e pergunte se quer re-delegar
         e. Re-delegação máxima: 1 vez (e somente se o usuário pedir)

      6. **Proibições absolutas:**
