# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies via pip (reads pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    # Mira a `dev`, não a default (`main`). Sem isto, toda PR do Dependabot cai
    # na `main` e a `dev` fica atrás — em 2026-09-14 a #48 entrou assim e a
    # `dev` precisou de um ff-only manual para reconvergir. Com target-branch,
    # o fluxo é um só: tudo entra pela `dev` e sobe para `main` na promoção.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "ThomazRossito"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      # Group all dev dependencies together to reduce PR noise
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "bandit"
          - "types-*"
      # Group Anthropic ecosystem updates together
      anthropic-ecosystem:
        patterns:
          - "anthropic"
          - "claude-agent-sdk"
          - "mcp"
      # Group Databricks ecosystem updates together
      databricks-ecosystem:
        patterns:
          - "databricks-*"
          - "mlflow"
      # Group Azure/Fabric ecosystem updates together
      azure-ecosystem:
        patterns:
          - "azure-*"
          - "semantic-link"
          - "microsoft-*"
    ignore:
      # Pin major version bumps that require manual review
      - dependency-name: "claude-agent-sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-settings"
        update-types: ["version-update:semver-major"]

      # ruff: o pyproject pina versão EXATA de propósito. O formatter do ruff
      # muda de estilo entre minors (0.16.x passou a formatar blocos de código
      # Markdown por padrão), o que quebrava `ruff format --check` no CI com
      # centenas de arquivos. Patches dentro do 0.15.x continuam chegando;
      # subir de minor/major é decisão manual, acompanhada de reformatação
      # do repo inteiro e do bump do rev no .pre-commit-config.yaml.
      # Contexto: auditoria 2026-09-13 (PR #39 ficou vermelha por isto).
      - dependency-name: "ruff"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

      # mcp: o 2.x renomeou FastMCP -> MCPServer e removeu mcp.server.fastmcp,
      # que os 10 MCP servers customizados importam. O pyproject tem teto <2.
      # Só subir junto da migração para a API v2.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "ThomazRossito"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
